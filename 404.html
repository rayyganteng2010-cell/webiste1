<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Halaman Tidak Ditemukan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg: url('https://files.catbox.moe/q9e70e.jpg');
      --pfp: url('https://files.catbox.moe/lenrjk.jpg');
      --c: #00aaff;
      --c2:#7c5cff;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#fff;
      display:grid;
      place-items:center;
      background:#05060a;
      position:relative;
      isolation:isolate;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow:hidden;
      padding:18px;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(900px 520px at 20% 10%, rgba(0,170,255,.22), transparent 55%),
        radial-gradient(900px 520px at 80% 90%, rgba(124,92,255,.18), transparent 55%),
        linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.78)),
        var(--bg);
      background-size: cover;
      background-position:center;
      background-repeat:no-repeat;
      filter:saturate(1.05) contrast(1.05);
      z-index:-2;
    }
    body::after{content:"";position:fixed;inset:0;background:linear-gradient(135deg, rgba(0,0,0,.22), rgba(0,0,0,.74));z-index:-1;}

    .wrap{width:min(840px, 94vw)}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.10);
      border-radius:26px;
      padding:26px;
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
      position:relative;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(520px 260px at 15% 0%, rgba(0,170,255,.16), transparent 60%),
        radial-gradient(520px 260px at 85% 100%, rgba(124,92,255,.12), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }
    .card > *{position:relative; z-index:1;}

    .top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .pfp{width:86px;height:86px;border-radius:999px;background-image:var(--pfp);background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.18);box-shadow:0 0 0 6px rgba(0,170,255,.14), 0 18px 40px rgba(0,0,0,.45)}

    .code{font-weight:900;letter-spacing:.06em;font-size:3.1rem;line-height:1;background: linear-gradient(45deg,#fff,var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .title{margin-top:6px;font-weight:900;font-size:1.35rem;letter-spacing:.01em}
    .desc{margin-top:8px;color:rgba(230,240,255,.78);line-height:1.75}
    .query{margin-top:10px;display:none; padding:10px 12px;border-radius:14px;border:1px dashed rgba(255,255,255,.18);background: rgba(0,0,0,.28);color:rgba(230,240,255,.82);word-break:break-word}

    .actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
    a.btn, button.btn{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      padding:12px 16px;border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color:#fff;text-decoration:none;
      font-weight:900;
      transition:transform .18s ease, background .18s ease, border-color .18s ease;
      cursor:pointer;
    }
    a.btn:hover, button.btn:hover{background: rgba(0,170,255,.16); border-color: rgba(0,170,255,.55); transform: translateY(-2px)}
    .btn.primary{border-color: rgba(0,170,255,.60); background: rgba(0,170,255,.10)}

    .hint{margin-top:14px;color:rgba(230,240,255,.55);font-size:.92rem}

    @media (max-width:520px){
      .code{font-size:2.6rem}
      .pfp{width:78px;height:78px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <div class="code">404</div>
          <div class="title">Halaman tidak ditemukan</div>
          <div class="desc">
            Link / pencarian yang kamu buka nggak ada di website ini.
            Balik ke menu utama atau cari di katalog.
          </div>
          <div class="query" id="qBox"></div>
        </div>
        <div class="pfp" aria-label="Foto profil"></div>
      </div>

      <div class="actions">
        <a class="btn primary" href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a class="btn" href="semua/produk.html"><i class="fa-solid fa-layer-group"></i> Katalog</a>
        <button class="btn" type="button" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
      </div>

      <div class="hint">Tip: kalau kamu nyari produk, coba buka <b>Katalog</b> lalu ketik kata kunci (contoh: <i>panel</i>, <i>bot</i>, <i>website</i>).</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const q = (params.get('q') || '').trim();
    const box = document.getElementById('qBox');
    if(q){
      box.style.display = 'block';
      box.innerHTML = `<b>Kata kunci:</b> ${q.replace(/[<>]/g,'')}`;
      document.title = `404 - "${q}"`;
    }
    document.getElementById('backBtn').addEventListener('click', () => history.length > 1 ? history.back() : (location.href='index.html'));
  </script>
</body>
</html>
